[package]
name = "fly-init"
version = "0.1.0"
authors = [
    "Jerome Gravel-Niquet <jeromegn@gmail.com>",
    "junhsss <junhsssr@gmail.com>",
]
edition = "2024"
build = "build.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["user", "hostname", "mount", "fs", "ioctl", "net", "process", "signal", "socket", "term", "reboot"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
    "io-std",
    "fs",
    "sync",
    "time",
] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
warp = "0.3"
procfs = "0.17"
rlimit = "0.10"
rtnetlink = "0.14"
ipnetwork = { version = "0.20", features = ["serde"] }
ifstructs = "0.1"
anyhow = "1"
thiserror = "2"
pin-project = "1"
os_pipe = "1"
tokio-vsock = "0.6"

[profile.release]
lto = true

[build-dependencies]
vergen-git2 = { version = "1", features = ["build"] }
